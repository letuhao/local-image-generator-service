# Production-shaped topology. ComfyUI + MinIO live on the private `internal`
# network only — no published ports here. Dev exposes loopback ports via
# docker-compose.override.yml (copy from docker-compose.override.yml.example).

services:
  image-gen-service:
    # Python package under `./app/` is copied into the image (see Dockerfile).
    # It is NOT mounted from the host — only `./config`, `./workflows`, `./models`
    # are bind-mounted below. After changing code in `app/`, rebuild this service:
    #   docker compose build --no-cache image-gen-service && docker compose up -d image-gen-service
    build:
      context: .
      dockerfile: Dockerfile
    image: image-gen-service:0.1.0
    environment:
      IMAGEGEN_ENV: ${IMAGEGEN_ENV:-dev}
      WEBHOOK_SIGNING_SECRETS: ${WEBHOOK_SIGNING_SECRETS:-}
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
      WEBHOOK_ALLOW_ANY_HOST: ${WEBHOOK_ALLOW_ANY_HOST:-false}
      WEBHOOK_HTTP_TIMEOUT_S: ${WEBHOOK_HTTP_TIMEOUT_S:-10}
      WEBHOOK_MAX_IN_FLIGHT: ${WEBHOOK_MAX_IN_FLIGHT:-8}
      # Cycle 1: auth + SQLite + logging are live. Later cycles bring more env into use.
      API_KEYS: ${API_KEYS:-}
      ADMIN_API_KEYS: ${ADMIN_API_KEYS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_PROMPTS: ${LOG_PROMPTS:-false}
      DATABASE_PATH: ${DATABASE_PATH:-/app/data/jobs.db}
      COMFYUI_URL: http://comfyui:8188
      COMFYUI_WS_URL: ws://comfyui:8188/ws
      STARTUP_SMOKE_ENABLED: ${STARTUP_SMOKE_ENABLED:-true}
      STARTUP_SMOKE_TIMEOUT_S: ${STARTUP_SMOKE_TIMEOUT_S:-120}
      ASYNC_MODE_ENABLED: ${ASYNC_MODE_ENABLED:-false}
      S3_INTERNAL_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-image-gen}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      VRAM_BUDGET_GB: ${VRAM_BUDGET_GB:-12}
      IMAGE_GEN_PUBLIC_BASE_URL: ${IMAGE_GEN_PUBLIC_BASE_URL:-http://127.0.0.1:8700}
      LORAS_ROOT: ${LORAS_ROOT:-/app/loras}
      # Cycle 6 — Civitai fetcher
      CIVITAI_API_TOKEN: ${CIVITAI_API_TOKEN:-}
      LORA_DIR_MAX_SIZE_GB: ${LORA_DIR_MAX_SIZE_GB:-60}
      LORA_MAX_SIZE_BYTES: ${LORA_MAX_SIZE_BYTES:-2147483648}
      LORA_MAX_CONCURRENT_FETCHES: ${LORA_MAX_CONCURRENT_FETCHES:-1}
      LORA_RECENT_USE_DAYS: ${LORA_RECENT_USE_DAYS:-7}
      LORA_LAST_USED_DEBOUNCE_S: ${LORA_LAST_USED_DEBOUNCE_S:-300}
      LORA_FETCH_METADATA_TIMEOUT_S: ${LORA_FETCH_METADATA_TIMEOUT_S:-30}
      LORA_FETCH_DOWNLOAD_OVERALL_TIMEOUT_S: ${LORA_FETCH_DOWNLOAD_OVERALL_TIMEOUT_S:-1800}
      LORA_FETCH_CHUNK_READ_TIMEOUT_S: ${LORA_FETCH_CHUNK_READ_TIMEOUT_S:-30}
    volumes:
      # SQLite job store. Bind mount in dev so operators can `sqlite3 data/jobs.db`.
      # Prod deploys should replace this with a named volume.
      - ./data:/app/data
      # Registry + workflows + models are read-only by the service. Cycle 3+.
      - ./config:/app/config:ro
      - ./workflows:/app/workflows:ro
      - ./models:/app/models:ro
      # LoRA library lives under `models/loras/` (same tree ComfyUI reads). Service
      # needs write access for Civitai fetch + `<name>.json` sidecars + last_used.
      - ./models/loras:/app/loras
    depends_on:
      minio:
        condition: service_healthy
      comfyui:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  comfyui:
    # Real sidecar — pinned ComfyUI + GGUF + WAN 2.2 Smooth workflow custom nodes.
    # Pin source of truth: docker/comfyui/custom-nodes.txt (WAN SHAs + Dockerfile ARG defaults).
    # Override only COMFYUI_REF / COMFYUI_GGUF_REF here unless you fork the Dockerfile ARG set.
    build:
      context: ./docker/comfyui
      args:
        COMFYUI_REF: ${COMFYUI_REF:-v0.20.1}
        COMFYUI_GGUF_REF: ${COMFYUI_GGUF_REF:-6ea2651e7df66d7585f6ffee804b20e92fb38b8a}
    image: image-gen-comfyui:0.20.1-wan22
    environment:
      # Persist HuggingFace metadata/cache on host so model nodes don't re-download.
      HF_HOME: /workspace/ComfyUI/models/.hf
      HF_HUB_CACHE: /workspace/ComfyUI/models/.hf/hub
      HF_HUB_DISABLE_TELEMETRY: "1"
      COMFY_EXTRA_ARGS: "--enable-manager"
    # Local-only tag — suppress the failing registry pull attempt every `up` does.
    pull_policy: never
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      # Full ComfyUI models tree — checkpoints/, vae/, loras/, etc. under ./models/.
      # Writable so WAS Node Suite and other custom nodes can auto-install/fetch
      # missing model assets into /workspace/ComfyUI/models at runtime.
      - ./models:/workspace/ComfyUI/models
      # Writable user tree — ComfyUI ≥0.9 persists settings.json + an asset DB
      # (SQLite) here. Without a writable mount, the web UI throws
      # PermissionError on save and the asset scanner's Session factory stays
      # None. Host-side state lives under ./data/comfyui-user/ (gitignored).
      #
      # NOTE: previously we also mounted ./workflows as :ro at
      # /workspace/ComfyUI/user/default/workflows so the ComfyUI web UI could
      # browse our JSON templates. On Docker Desktop / Windows that :ro overlay
      # forced Docker to pre-create `default/` as root-owned, blocking the
      # container's `comfy` user from writing settings.json. Our API does not
      # depend on ComfyUI's workflow browser (we send graphs directly via
      # /prompt). If you want to inspect a workflow in the UI, drag-load the
      # JSON from ./workflows/ on the host.
      - ./data/comfyui-user:/workspace/ComfyUI/user
      # Manager runtime state/config (security_level + network_mode). Mount the
      # whole directory so Manager can write channels/cache files.
      - ./docker/comfyui/manager-runtime:/workspace/ComfyUI/user/__manager
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8188/system_stats > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 120s
      retries: 3
    restart: unless-stopped

  # Optional second ComfyUI for manual workflows that want SageAttention on a maintained
  # stack (Sage 2.x + recent PyTorch/CUDA). Does NOT replace `comfyui` — image-gen-service
  # still targets `http://comfyui:8188` only.
  #
  # Image choice: `ghcr.io/pixeloven/comfyui/complete:cuda-latest` — “complete GPU” profile
  # with SageAttention called out upstream (see https://github.com/pixeloven/ComfyUI-Docker).
  # RTX 4090 (SM 8.9): use recent NVIDIA drivers; pull a specific digest in prod if you
  # need a frozen baseline.
  #
  # Start manually:  docker compose --profile sage up -d comfyui-sage
  # Stop:            docker compose --profile sage stop comfyui-sage
  #
  # GPU: avoid running `comfyui` and `comfyui-sage` on the same GPU at full load — share
  # `./models` but use separate user/output dirs below.
  comfyui-sage:
    image: ghcr.io/pixeloven/comfyui/complete:cuda-latest
    profiles: ["sage"]
    environment:
      PUID: ${COMFY_SAGE_PUID:-1000}
      PGID: ${COMFY_SAGE_PGID:-1000}
      COMFY_PORT: "8188"
      NVIDIA_VISIBLE_DEVICES: ${COMFY_SAGE_GPUS:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HOME: /app/models/.hf
      HF_HUB_CACHE: /app/models/.hf/hub
      HF_HUB_DISABLE_TELEMETRY: "1"
      # SageAttention (override whole string in `.env` only if you need more flags).
      CLI_ARGS: "--use-sage-attention"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${COMFY_SAGE_GPU_COUNT:-1}
              capabilities: [gpu]
    volumes:
      # Pixeloven/HF cache uses /app/models; ComfyUI scans models under /app/ComfyUI/models (see folder_paths).
      # Bind the same host ./models tree to both so loaders (CheckpointLoaderSimple, etc.) see files.
      - ./models:/app/models
      - ./models:/app/ComfyUI/models
      - ./data/comfyui-sage-user:/app/user
      # Manager stores config.ini plus writable channel/cache files under __manager. Binding only config.ini
      # leaves the directory image-owned → PermissionError on channels.list. Mount whole seed dir (rw).
      # Seed: docker/comfyui-sage/manager-runtime/config.ini (weak + personal_cloud).
      - ./docker/comfyui-sage/manager-runtime:/app/ComfyUI/user/__manager
      - ./data/comfyui-sage-custom_nodes:/app/custom_nodes
      - ./data/comfyui-sage/output:/app/output
      - ./data/comfyui-sage/input:/app/input
      - ./data/comfyui-sage/temp:/app/temp
    ports:
      # Loopback-only while `comfyui-sage` runs (`--profile sage`). Override bind/port via `.env`.
      - "${COMFY_SAGE_HOST_BIND:-127.0.0.1}:${COMFY_SAGE_HOST_PORT:-8190}:8188"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8188/system_stats > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 3
    restart: unless-stopped

  # Minimal Ubuntu 24.04 + Python — no ComfyUI preinstalled. For DIY stacks you own.
  # Build:   docker compose --profile clean build comfyui-clean
  # Shell:   docker compose --profile clean run --rm --service-ports -it comfyui-clean bash
  # Launch:   docker compose --profile clean run --rm --service-ports -it comfyui-clean bash /opt/comfyui-clean/run-comfyui-entry.sh
  # Up:      docker compose --profile clean up -d comfyui-clean
  # Export:  docker commit <id> my-comfyui:custom
  comfyui-clean:
    build:
      context: ./docker/comfyui-clean
    image: comfyui-clean-base:cuda13.1-devel-ubuntu24
    profiles: ["clean"]
    environment:
      NVIDIA_VISIBLE_DEVICES: ${COMFY_CLEAN_GPUS:-all}
      # RTX Video / NvVFX (comfyui_nvidia_rtx_nodes) needs NGX from the driver stack.
      # Default toolkit injection often omits it unless `video` is included; if NvVFX still
      # fails with code -12, bind-mount host libnvidia-ngx.so.1 (see volumes comment below).
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      # Match `comfyui` sidecar: HF cache lives under mounted models tree.
      HF_HOME: /workspace/ComfyUI/models/.hf
      HF_HUB_CACHE: /workspace/ComfyUI/models/.hf/hub
      HF_HUB_DISABLE_TELEMETRY: "1"
      # ComfyUI-Manager (pip): `pip install -r /opt/comfyui-clean/pip-extras-essentials.txt` in ComfyUI venv — same pin family as docker/comfyui (>=4.2.1, not `--pre`).
      COMFY_EXTRA_ARGS: "--enable-manager"
      COMFY_LISTEN_ADDR: "0.0.0.0"
      COMFY_PORT: "8188"
      COMFY_PREVIEW_METHOD: "none"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${COMFY_CLEAN_GPU_COUNT:-1}
              capabilities: [gpu]
    volumes:
      # ── Docker Desktop Windows (NTFS bind): ComfyUI-Manager may fail writing
      #    `custom_nodes/*/ .git /.cnr-id` EPERM ↔ metadata mapping. Prefer:
      #    PowerShell: attrib -R ".\data\comfyui-clean-workspace\ComfyUI\custom_nodes\*" /S /D
      #    Avoid chmod -R on this tree inside Linux — it often breaks NTFS-mount writes.
      #    Last resort: put the workspace under WSL2 ext4 (\\wsl$\...) instead of drive G:/.
      # Clone ComfyUI here: `/workspace/ComfyUI` (same `./models/` tree as `comfyui` / `comfyui-sage`).
      - ./data/comfyui-clean-workspace:/workspace
      - ./models:/workspace/ComfyUI/models
      # Requirements ref (host file) — works without rebuilding the image.
      - ./docker/comfyui-clean/pip-extras-essentials.txt:/opt/comfyui-clean/pip-extras-essentials.txt:ro
      # Mounted body may have Windows CRLF; run-comfyui-entry.sh strips \r before exec.
      - ./docker/comfyui-clean/run-comfyui.sh:/opt/comfyui-clean/run-comfyui.host.sh:ro
      # Writable ComfyUI server user tree (settings, DB, default/, …) — same idea as ./data/comfyui-user.
      # Host: mkdir -p data/comfyui-clean-user
      - ./data/comfyui-clean-user:/workspace/ComfyUI/user
      # Seed config.ini + Manager cache dir (overlays …/user/__manager).
      - ./docker/comfyui-clean/manager-runtime:/workspace/ComfyUI/user/__manager
      # Optional — NvVFX / RTX VSR: if `ls /usr/lib/x86_64-linux-gnu/libnvidia-ngx.so.1`
      # is missing inside the container, expose NGX from the WSL driver libs (path is on
      # the WSL distro, not inside G:/). Run compose from WSL or set COMFY_CLEAN_WSL_LIB.
      # Uncomment after verifying the file exists on the host: ls /usr/lib/wsl/lib/libnvidia-ngx.so.1
      # - ${COMFY_CLEAN_WSL_LIB:-/usr/lib/wsl/lib}/libnvidia-ngx.so.1:/usr/lib/x86_64-linux-gnu/libnvidia-ngx.so.1:ro
    # 0.0.0.0 = LAN + localhost. Set COMFY_CLEAN_HOST_BIND=127.0.0.1 to block remote.
    # ComfyUI has no built-in auth — use firewall/VPN if exposing beyond trusted LAN.
    ports:
      - "${COMFY_CLEAN_HOST_BIND:-0.0.0.0}:${COMFY_CLEAN_HOST_PORT:-8192}:8188"
    networks:
      - internal
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    networks:
      - internal
    healthcheck:
      # curl is shipped by current minio/minio (RHEL UBI base). wget fallback
      # guards against future base-image churn where curl might be removed.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live 2>/dev/null || wget -q -O- http://127.0.0.1:9000/minio/health/live 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  minio-data:
