[default]
# comfyui-clean profile — same policy shape as docker/comfyui/manager-runtime.
# If you expose ComfyUI on LAN, keep installs scoped; tighten security_level if needed.
security_level = weak
network_mode = personal_cloud

git_exe =
use_uv = False
use_unified_resolver = False
channel_url = https://raw.githubusercontent.com/ltdrdata/ComfyUI-Manager/main
share_option = all
bypass_ssl = False
file_logging = True
update_policy = stable-comfyui
windows_selector_event_loop_policy = False
model_download_by_agent = False
downgrade_blacklist =
always_lazy_install = False
db_mode = cache
verbose = False
