[default]
# ComfyUI-Manager (pip): main comfyui Docker profile.
# Security policy for installs when server listens on 0.0.0.0 (non-loopback).
security_level = weak
network_mode = personal_cloud

git_exe =
use_uv = True
use_unified_resolver = False
channel_url = https://raw.githubusercontent.com/ltdrdata/ComfyUI-Manager/main
share_option = all
bypass_ssl = False
file_logging = True
update_policy = stable-comfyui
windows_selector_event_loop_policy = False
model_download_by_agent = False
downgrade_blacklist =
always_lazy_install = False
db_mode = cache
verbose = False
