  # WAN 2.x video (ComfyUI-WanVideoWrapper). Requires Docker ComfyUI with WAN nodes + VHS.
  # checkpoint MUST appear in Comfy's diffusion_models scan (bind-mount ./models).
  #
  # Text encoder trap: Comfy lists whatever sits in models/text_encoders/. If you only have
  # umt5_xxl_fp8_e4m3fn_scaled.safetensors, /prompt accepts it but execution FAILS —
  # LoadWanVideoT5TextEncoder does not support FP8 scaled ("scaled_fp8" in state dict).
  # You MUST add a non-scaled UMT5-xxl encoder (bf16/fp16). Typical filename:
  #   umt5-xxl-enc-bf16.safetensors → ./models/text_encoders/ (see Kijai WanVideo_models / WanVideo_comfy on HF).
  # Until that file exists, value_not_in_list for umt5-xxl-enc-bf16 is expected.
  # After copying the file in, restart image-gen-service and retry.
  - name: wan22-smooth-t2v
    backend: comfyui
    family: wan22
    prediction: eps
    workflow: workflows/wan22_t2v_api.json
    workflow_with_audio: workflows/wan22_t2v_audio_api.json
    mmaudio_vae: mmaudio/mmaudio_vae_44k_fp16.safetensors
    mmaudio_synchformer: mmaudio/mmaudio_synchformer_fp16.safetensors
    mmaudio_clip: mmaudio/apple_DFN5B-CLIP-ViT-H-14-384_fp16.safetensors
    mmaudio_diffusion: mmaudio/mmaudio_large_44k_v2_fp16.safetensors
    checkpoint: diffusion_models/SmoothMix_T2V_High_v3.safetensors
    wan_unet_low: diffusion_models/SmoothMix_T2V_Low_v3.safetensors
    vae: vae/Wan2_1_VAE_fp32.safetensors
    wan_t5_encoder: text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors
    skip_asset_validation: true
    # No LoRA: SmoothMix T2V has distillation baked in, external LoRAs incompatible.
    default_loras: []
    capabilities:
      video_gen: true
      video_task: t2v
      skip_startup_smoke: true
    defaults:
      size: "832x480"
      steps: 6
      cfg: 1.0
      shift: 8.0
      scheduler: simple
      negative_prompt: ""
      job_timeout_s: 3600
      mmaudio_steps: 25
      mmaudio_cfg: 4.5
    limits:
      steps_max: 60
      frames_max: 9001
      size_max_pixels: 16588800
    vram_estimate_gb: 11

  - name: wan22-smooth-i2v
    backend: comfyui
    family: wan22
    prediction: eps
    workflow: workflows/wan22_i2v_api.json
    workflow_with_audio: workflows/wan22_i2v_audio_api.json
    mmaudio_vae: mmaudio/mmaudio_vae_44k_fp16.safetensors
    mmaudio_synchformer: mmaudio/mmaudio_synchformer_fp16.safetensors
    mmaudio_clip: mmaudio/apple_DFN5B-CLIP-ViT-H-14-384_fp16.safetensors
    mmaudio_diffusion: mmaudio/mmaudio_large_44k_v2_fp16.safetensors
    checkpoint: diffusion_models/SmoothMix_I2V_v2_High.safetensors
    wan_unet_low: diffusion_models/SmoothMix_I2V_v2_Low.safetensors
    vae: vae/Wan2_1_VAE_fp32.safetensors
    wan_t5_encoder: text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors
    wan_clip_vision: clip_vision/clip_vision_h.safetensors
    skip_asset_validation: true
    # rank128_bf16 LoRA loaded twice per SmoothMix I2V v2 author comment:
    # "lightx2v_I2V_14B_480p_cfg_step_distill_rank128_bf16 set with weight 3.0 on High
    # and 1.5 on Low" — cross_attn.k_img keys won't map (SmoothMix uses different
    # image conditioning) but self-attn/FFN distillation keys load and are sufficient.
    default_loras:
      - name: wan2.2/lightx2v_I2V_14B_480p_cfg_step_distill_rank128_bf16
        weight: 3.0
      - name: wan2.2/lightx2v_I2V_14B_480p_cfg_step_distill_rank128_bf16
        weight: 1.5
    capabilities:
      video_gen: true
      video_task: i2v
      skip_startup_smoke: true
    defaults:
      size: "832x480"
      # Distilled via rank128 LoRA (3.0+1.5): use 4-6 steps, cfg=1.
      steps: 6
      cfg: 1.0
      shift: 8.0
      scheduler: simple
      negative_prompt: ""
      job_timeout_s: 3600
      mmaudio_steps: 25
      mmaudio_cfg: 4.5
    limits:
      steps_max: 60
      frames_max: 9001
      size_max_pixels: 16588800
    vram_estimate_gb: 11

  # -- LTX Video / 10Eros ------------------------------------------------
  #
  # 10Eros v1 (LTX Video 2.3) - triple-pass (First -> Renoising -> Upscale).
  # Both I2V and T2V workflows require an init_image:
  #   - I2V: init_image is the first frame.
  #   - T2V: init_image sets the aspect ratio / resolution via GetImageSize.
  #
  # Pre-baked LoRAs (injected automatically via default_loras):
  #   - ltx23/ltx-2.3-22b-distilled-lora-1.1  (acceleration, weight 1.0)
  #   - ltx23/ltx23_edit_anything_global_rank128_v1_9000steps_adamw (IC-LoRA, weight 1.0)
  # Spatial upscaler path is hardcoded in the workflow JSON.

  - name: 10eros-i2v
    backend: comfyui
    family: ltxv
    prediction: eps
    workflow: workflows/10eros_i2v_api.json
    checkpoint: checkpoints/10Eros_v1_bf16.safetensors
    ltxv_text_encoder: text_encoders/gemma_3_12B_it_fp8_e4m3fn.safetensors
    default_loras:
      - name: ltx23/ltx-2.3-22b-distilled-lora-1.1_fro90_ceil72_condsafe
        weight: 1.0
      - name: ltx23/ltx23_edit_anything_global_rank128_v1_9000steps_adamw
        weight: 1.0
    capabilities:
      video_gen: true
      video_task: i2v
      skip_startup_smoke: true
    defaults:
      size: "768x512"
      steps: 10
