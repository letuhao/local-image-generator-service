    clip_l: text_encoders/clip_l.safetensors
    t5xxl: text_encoders/t5xxl_fp8_e4m3fn.safetensors
    dual_clip_type: flux
    capabilities:
      image_gen: true
    defaults:
      size: "1024x1024"
